services:

  hirely-db:
    image: postgres:16
    container_name: hirely-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hirely
    volumes:
      - hirely_pg_data:/var/lib/postgresql/data
    ports:
      - "5444:5432"

volumes:
  hirely_pg_data:
